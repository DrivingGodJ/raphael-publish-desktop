name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Test desktop project storage and publisher
        run: |
          pnpm test:desktop-backend
          pnpm test:wechat-publisher

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  winui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - name: Test native project and publisher logic
        run: dotnet run --project native/Tests/Raphael.Core.Tests.csproj -c Release
      - name: Build WinUI 3 app
        run: pwsh -NoProfile -File scripts/build-winui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Raphael-Publish-WinUI-windows-x64
          path: release/winui-v2.0.0/
