<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Raphael Publish Desktop — 本地优先的微信公众号排版桌面应用">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1d36"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="920" cy="110" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="220" cy="330" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="854" y1="180" x2="908" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="previewAccent" x1="18" y1="23" x2="82" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.45; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes gentleLift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .glow { animation: breathe 5.5s ease-in-out infinite; }
      .beam-line { stroke-dasharray: 7 5; animation: flow 1.8s linear infinite; }
      .dot { transform-box: fill-box; transform-origin: center; animation: pulseDot 3s ease-in-out infinite; }
      .float-card { animation: gentleLift 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base rounded card -->
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#bg)" stroke="url(#cardEdge)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#glowBlue)" class="glow"/>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#glowGreen)"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="72" x2="1200" y2="72"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
  </g>

  <!-- Left brand identity -->
  <g transform="translate(56, 56)">
    <!-- Official Raphael Publish R mark -->
    <rect width="54" height="54" rx="14" fill="#ffffff"/>
    <g transform="translate(10, 10) scale(1.42)">
      <path d="M16.5 7.5L5 19H10.5C13.5376 19 16 16.5376 16 13.5C16 10.4624 13.5376 8 10.5 8H8.5V11.5L16.5 7.5Z" fill="#0f172a"/>
      <path d="M8.5 4H10.5C15.7467 4 20 8.25329 20 13.5C20 18.7467 15.7467 23 10.5 23H4V4H8.5Z" fill="none" stroke-width="2.5" stroke="#0f172a"/>
      <path d="M4 11.5H8.5" stroke-width="2.5" stroke-linecap="round" stroke="#0f172a"/>
    </g>

    <!-- Version badge -->
    <g transform="translate(70, 12)">
      <rect width="156" height="30" rx="15" fill="#0a84ff" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.4"/>
      <circle cx="18" cy="15" r="4" fill="#38bdf8" class="dot"/>
      <text x="32" y="20" fill="#bae6fd" class="mono" font-size="13" font-weight="600">v2.2.0 Desktop</text>
    </g>

    <!-- Main title -->
    <text x="0" y="114" fill="#f8fafc" class="sans" font-size="42" font-weight="700" letter-spacing="-0.5">Raphael Publish</text>
    <text x="0" y="156" fill="#cbd5e1" class="sans" font-size="19" font-weight="400">把公众号文章整理、图片归档与精致排版，安稳留在本地</text>
    <text x="0" y="186" fill="#94a3b8" class="sans" font-size="14.5">粘贴 FlowUs 富文本 · 30 款主题实时预览 · 一键复制 / 导出 / 微信草稿箱直发</text>

    <!-- Feature capsules -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="152" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="76" y="22" text-anchor="middle" fill="#e2e8f0" class="sans" font-size="13" font-weight="500">Windows WinUI 3</text>

      <rect x="164" y="0" width="142" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="235" y="22" text-anchor="middle" fill="#e2e8f0" class="sans" font-size="13" font-weight="500">macOS Web UI</text>

      <rect x="318" y="0" width="130" height="34" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="383" y="22" text-anchor="middle" fill="#a7f3d0" class="sans" font-size="13" font-weight="500">应用内自动更新</text>
    </g>
  </g>

  <!-- Right visual motif: Markdown editor -> Typeset WeChat Preview -->
  <g class="float-card">
    <!-- Left mini card: Markdown Source -->
    <g transform="translate(656, 62)">
      <rect width="196" height="236" rx="14" fill="#111827" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#ef4444" fill-opacity="0.75"/>
      <circle cx="32" cy="18" r="4" fill="#f59e0b" fill-opacity="0.75"/>
      <circle cx="46" cy="18" r="4" fill="#10b981" fill-opacity="0.75"/>
      <text x="178" y="22" text-anchor="end" fill="#64748b" class="mono" font-size="10.5">正文.md</text>
      <line x1="14" y1="34" x2="182" y2="34" stroke="#ffffff" stroke-opacity="0.08"/>

      <text x="16" y="60" fill="#38bdf8" class="mono" font-size="12"># 本期精选长文</text>
      <text x="16" y="84" fill="#94a3b8" class="mono" font-size="11">&gt; 本地优先 · 自动保存</text>
      <rect x="16" y="100" width="154" height="7" rx="3.5" fill="#475569" fill-opacity="0.55"/>
      <rect x="16" y="116" width="132" height="7" rx="3.5" fill="#475569" fill-opacity="0.45"/>

      <rect x="16" y="138" width="164" height="32" rx="8" fill="#0a84ff" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.28"/>
      <text x="26" y="158" fill="#7dd3fc" class="mono" font-size="10.5">![](图片/001.png)</text>

      <rect x="16" y="184" width="146" height="7" rx="3.5" fill="#475569" fill-opacity="0.5"/>
      <rect x="16" y="200" width="114" height="7" rx="3.5" fill="#475569" fill-opacity="0.38"/>
    </g>

    <!-- Flowing transform connector -->
    <path d="M 854 180 L 908 180" fill="none" stroke="url(#beam)" stroke-width="2.5" stroke-linecap="round" class="beam-line"/>
    <circle cx="881" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.2"/>
    <path d="M 876 180 L 886 180 M 882 175 L 887 180 L 882 185" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right mini card: Styled WeChat Preview -->
    <g transform="translate(910, 52)">
      <rect width="234" height="256" rx="16" fill="#f8fafc" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
      <!-- Preview top accent bar -->
      <rect x="18" y="20" width="64" height="6" rx="3" fill="url(#previewAccent)"/>
      <text x="216" y="26" text-anchor="end" fill="#64748b" class="sans" font-size="10.5" font-weight="600">30 款主题</text>

      <!-- Rendered heading -->
      <text x="18" y="56" fill="#0f172a" class="sans" font-size="16" font-weight="700">本期精选长文</text>

      <!-- Styled quote block -->
      <rect x="18" y="70" width="198" height="32" rx="6" fill="#eff6ff"/>
      <rect x="18" y="70" width="4" height="32" rx="2" fill="#0a84ff"/>
      <text x="30" y="90" fill="#1e40af" class="sans" font-size="11.5" font-weight="500">本地优先 · 图片随文章归档</text>

      <!-- Rendered body lines -->
      <rect x="18" y="116" width="192" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="18" y="130" width="164" height="7" rx="3.5" fill="#e2e8f0"/>

      <!-- Rendered cover illustration block -->
      <rect x="18" y="148" width="198" height="58" rx="10" fill="#0f172a"/>
      <circle cx="52" cy="177" r="14" fill="#0a84ff" fill-opacity="0.35"/>
      <circle cx="52" cy="177" r="7" fill="#38bdf8"/>
      <rect x="78" y="166" width="96" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.85"/>
      <rect x="78" y="181" width="68" height="6" rx="3" fill="#94a3b8" fill-opacity="0.65"/>

      <!-- Bottom action pill -->
      <rect x="18" y="218" width="108" height="24" rx="12" fill="#0f172a"/>
      <text x="72" y="234" text-anchor="middle" fill="#ffffff" class="sans" font-size="10.5" font-weight="600">复制到公众号</text>
      <rect x="134" y="218" width="82" height="24" rx="12" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="175" y="234" text-anchor="middle" fill="#047857" class="sans" font-size="10.5" font-weight="600">发布草稿</text>
    </g>
  </g>
</svg>
